name: basin3dschema
description: 'Modified BASIN-3D schema including ObservationMeasurementTimeSeries
  and MonitoringFeature classes

  for representing time-series observational data and monitoring locations.'
title: BASIN-3D Schema with ObservationMeasurementTimeSeries and MonitoringFeature
see_also:
- https://dschristianson.github.io/basin3dschema
- https://github.com/BASIN-3D/basin3d
id: https://w3id.org/dschristianson/basin3dschema
imports:
- linkml:types
license: MIT
prefixes:
  basin3dschema:
    prefix_prefix: basin3dschema
    prefix_reference: https://w3id.org/dschristianson/basin3dschema/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  example:
    prefix_prefix: example
    prefix_reference: https://example.org/
  geo:
    prefix_prefix: geo
    prefix_reference: http://www.w3.org/2003/01/geo/wgs84_pos#
default_prefix: basin3dschema
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  MappedAttributeEnum:
    name: MappedAttributeEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/MappedAttributeEnum
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      OBSERVED_PROPERTY:
        text: OBSERVED_PROPERTY
        description: more here
      AGGREGATION_DURATION:
        text: AGGREGATION_DURATION
        description: more here
      RESULT_QUALITY:
        text: RESULT_QUALITY
        description: more here
      SAMPLING_MEDIUM:
        text: SAMPLING_MEDIUM
        description: more here
      STATISTIC:
        text: STATISTIC
        description: more here
  AggregationDurationEnum:
    name: AggregationDurationEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/AggregationDurationEnum
    description: Duration over which observations are aggregated
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      YEAR:
        text: YEAR
        description: Annual aggregation
      MONTH:
        text: MONTH
        description: Monthly aggregation
      DAY:
        text: DAY
        description: Daily aggregation
      HOUR:
        text: HOUR
        description: Hourly aggregation
      MINUTE:
        text: MINUTE
        description: Minute-level aggregation
  CoordinateTypeEnum:
    name: CoordinateTypeEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/CoordinateTypeEnum
    description: Type of coordinate system
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      GEOGRAPHIC:
        text: GEOGRAPHIC
        description: Geographic coordinate system
      PROJECTED:
        text: PROJECTED
        description: Projected coordinate system
      LOCAL:
        text: LOCAL
        description: Local coordinate system
  RepresentativePointTypeEnum:
    name: RepresentativePointTypeEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/RepresentativePointTypeEnum
    description: position of the representative point
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      REPRESENTATIVE_POINT_TYPE_CENTER_LOCAL_SURFACE:
        text: REPRESENTATIVE_POINT_TYPE_CENTER_LOCAL_SURFACE
        description: Placement of the representative point is the center of a local
          surface
      REPRESENTATIVE_POINT_TYPE_UPPER_LEFT_CORNER:
        text: REPRESENTATIVE_POINT_TYPE_UPPER_LEFT_CORNER
        description: Placement of the representative point is the upper left corner
          (northwest)
      REPRESENTATIVE_POINT_TYPE_UPPER_RIGHT_CORNER:
        text: REPRESENTATIVE_POINT_TYPE_UPPER_RIGHT_CORNER
        description: Placement of the representative point is the upper right corner
          (northeast)
      REPRESENTATIVE_POINT_TYPE_LOWER_LEFT_CORNER:
        text: REPRESENTATIVE_POINT_TYPE_LOWER_LEFT_CORNER
        description: Placement of the representative point is the lower left corner
          (southhwest)
      REPRESENTATIVE_POINT_TYPE_LOWER_RIGHT_CORNER:
        text: REPRESENTATIVE_POINT_TYPE_LOWER_RIGHT_CORNER
        description: Placement of the representative point is the lower right corner
          (northeast)
  VerticalPositionDatumEnum:
    name: VerticalPositionDatumEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/VerticalPositionDatumEnum
    description: references for vertical position
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      DATUM_LOCAL_SURFACE:
        text: DATUM_LOCAL_SURFACE
        description: local surface
      DATUM_MEAN_SEA_LEVEL:
        text: DATUM_MEAN_SEA_LEVEL
        description: mean sea level
  FeatureTypeEnum:
    name: FeatureTypeEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/FeatureTypeEnum
    description: Type of monitoring or sampling feature
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      POINT:
        text: POINT
        description: Point feature
      VERTICAL_PATH:
        text: VERTICAL_PATH
        description: Vertical curve feature
      HORIZONTAL_PATH:
        text: HORIZONTAL_PATH
        description: Horizontal cure feature
      PLOT:
        text: PLOT
        description: sampling area defined by a polygon
      SITE:
        text: SITE
        description: area of research project defined by a polygon
      REGION:
        text: REGION
        description: Regional feature
      SUBBASIN:
        text: SUBBASIN
        description: Sub-basin feature
      BASIN:
        text: BASIN
        description: Basin feature
  ObservationTypeEnum:
    name: ObservationTypeEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/ObservationTypeEnum
    description: Type of observation measurement
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      MEASUREMENT_TVP_TIMESERIES:
        text: MEASUREMENT_TVP_TIMESERIES
        description: Time-value pair time series measurement
      MEASUREMENT_TIMESERIES:
        text: MEASUREMENT_TIMESERIES
        description: Time series measurement
  SamplingMediumEnum:
    name: SamplingMediumEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/SamplingMediumEnum
    description: Medium in which sampling occurred
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      WATER:
        text: WATER
        description: Water sampling medium
      GAS:
        text: GAS
        description: Gas sampling medium
      SOLID_PHASE:
        text: SOLID_PHASE
        description: Solid sampling medium
      OTHER:
        text: OTHER
        description: Other sampling medium
      NOT_APPLICABLE:
        text: NOT_APPLICABLE
        description: not applicable
  ShapeEnum:
    name: ShapeEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/ShapeEnum
    description: Geometric shape of features
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      POINT:
        text: POINT
        description: Point geometry
      LINE:
        text: LINE
        description: Line geometry
      SOLID:
        text: SOLID
        description: Volume geometry
      SURFACE:
        text: SURFACE
        description: Surface geometry, described by polygon
  StatisticEnum:
    name: StatisticEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/StatisticEnum
    description: Statistical measures
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      MEAN:
        text: MEAN
        description: Mean/average value
      MIN:
        text: MIN
        description: Minimum value
      MAX:
        text: MAX
        description: Maximum value
      TOTAL:
        text: TOTAL
        description: Sum of values
  TimeReferencePositionEnum:
    name: TimeReferencePositionEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/TimeReferencePositionEnum
    description: Position of time reference within aggregation period
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      START:
        text: START
        description: Start of time period
      MIDDLE:
        text: MIDDLE
        description: Middle of time period
      END:
        text: END
        description: End of time period
  VerticalExtentTypeEnum:
    name: VerticalExtentTypeEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/VerticalExtentTypeEnum
    description: Type of vertical extent measurement
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      ALTITUDE:
        text: ALTITUDE
        description: Altitude above sea level
      DEPTH:
        text: DEPTH
        description: Depth below surface
      HEIGHT:
        text: HEIGHT
        description: Height above ground
  RelationshipRoleEnum:
    name: RelationshipRoleEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/RelationshipRoleEnum
    description: Role in sampling feature relationships
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      PARENT:
        text: PARENT
        description: Parent relationship
  ResultQualityEnum:
    name: ResultQualityEnum
    definition_uri: https://w3id.org/dschristianson/basin3dschema/ResultQualityEnum
    description: Quality code for the result
    from_schema: https://w3id.org/dschristianson/basin3dschema
    permissible_values:
      UNVALIDATED:
        text: UNVALIDATED
        description: The result is raw or unchecked for quality. Synonyms Unchecked,
          Preliminary, No QC
      VALIDATED:
        text: VALIDATED
        description: The result has been checked for quality and no issues identified.
          Synonyms Checked, Accepted, Pass, OK, Good
      REJECTED:
        text: REJECTED
        description: The result is identified as poor quality. Synonyms Poor, Bad,
          Unaccepted
      SUSPECTED:
        text: SUSPECTED
        description: The result's quality is suspect. Synonyms Questionable, Doubtful,
          Spike/Noise, Flagged
      ESTIMATED:
        text: ESTIMATED
        description: The result is estimated. Synonyms Interpolated, Modeled.
      NOT_SUPPORTED:
        text: NOT_SUPPORTED
        description: not supported
slots:
  id:
    name: id
    definition_uri: https://w3id.org/dschristianson/basin3dschema/id
    description: A unique identifier for a thing
    from_schema: https://w3id.org/dschristianson/basin3dschema
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: Base
    domain_of:
    - DataSource
    - Base
    range: uriorcurie
    required: true
  datasource:
    name: datasource
    definition_uri: https://w3id.org/dschristianson/basin3dschema/datasource
    description: Data source for this observation
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:datasource
    owner: Base
    domain_of:
    - AttributeMapping
    - Base
    range: DataSource
  first_name:
    name: first_name
    definition_uri: https://w3id.org/dschristianson/basin3dschema/first_name
    description: First name for a person
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:first_name
    owner: Person
    domain_of:
    - Person
    range: string
  last_name:
    name: last_name
    definition_uri: https://w3id.org/dschristianson/basin3dschema/last_name
    description: Last name for a person
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:last_name
    owner: Person
    domain_of:
    - Person
    range: string
  institution:
    name: institution
    definition_uri: https://w3id.org/dschristianson/basin3dschema/institution
    description: more here
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:institution
    owner: Person
    domain_of:
    - Person
    range: string
  email:
    name: email
    definition_uri: https://w3id.org/dschristianson/basin3dschema/email
    description: The main email address of a person
    from_schema: https://w3id.org/dschristianson/basin3dschema
    mappings:
    - schema:email
    slot_uri: schema:email
    owner: Person
    domain_of:
    - Person
    range: string
  name:
    name: name
    definition_uri: https://w3id.org/dschristianson/basin3dschema/name
    description: Human readable name
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:name
    owner: Feature
    domain_of:
    - DataSource
    - Feature
    range: string
  datasource_ids:
    name: datasource_ids
    definition_uri: https://w3id.org/dschristianson/basin3dschema/datasource_ids
    description: Data source identifiers
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:datasource_ids
    owner: Base
    domain_of:
    - Base
    range: string
    multivalued: true
  description:
    name: description
    definition_uri: https://w3id.org/dschristianson/basin3dschema/description
    description: more detailed explanation of the feature
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:description
    owner: Feature
    domain_of:
    - Feature
    range: string
  observed_properties:
    name: observed_properties
    definition_uri: https://w3id.org/dschristianson/basin3dschema/observed_properties
    description: a list of observed properties on the feature
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:observed_properties
    owner: Feature
    domain_of:
    - Feature
    range: string
  related_party:
    name: related_party
    definition_uri: https://w3id.org/dschristianson/basin3dschema/related_party
    description: list of Person, people or organizations responsible for Feature
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:related_party
    owner: MonitoringFeature
    domain_of:
    - MonitoringFeature
    range: string
  basin3d_vocab:
    name: basin3d_vocab
    definition_uri: https://w3id.org/dschristianson/basin3dschema/basin3d_vocab
    description: common vocabulary for basin3d
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:basin3d_vocab
    owner: AttributeMapping
    domain_of:
    - ObservedProperty
    - AttributeMapping
    range: string
  full_name:
    name: full_name
    definition_uri: https://w3id.org/dschristianson/basin3dschema/full_name
    description: full name of the observed property
    from_schema: https://w3id.org/dschristianson/basin3dschema
    slot_uri: basin3dschema:full_name
    owner: ObservedProperty
    domain_of:
    - ObservedProperty
    range: string
  categories:
    name: categories
    definition_uri: https://w3id.org/dschristianson/basin3dschema/categories
