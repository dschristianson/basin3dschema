---
id: https://w3id.org/dschristianson/basin3dschema
name: basin3dschema
title: BASIN-3D Schema with ObservationMeasurementTimeSeries and MonitoringFeature
description: |-
  Modified BASIN-3D schema including ObservationMeasurementTimeSeries and MonitoringFeature classes
  for representing time-series observational data and monitoring locations.
license: MIT
see_also:
  - https://dschristianson.github.io/basin3dschema
  - https://github.com/BASIN-3D/basin3d

prefixes:
  basin3dschema: https://w3id.org/dschristianson/basin3dschema/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
  geo: http://www.w3.org/2003/01/geo/wgs84_pos#
default_prefix: basin3dschema
default_range: string

imports:
  - linkml:types

classes:

  DataSource:
    description: >-
      Represents a data source containing credentials, location, and identification
    slots:
      - id
      - name
      - id_prefix
      - location
      - credentials

  ObservedProperty:
    slots:
      - basin3d_vocab
      - full_name
      - categories
      - units

  AttributeMapping:
    slots:
      - attr_type
      - basin3d_vocab
      - basin3d_desc
      - datasource_vocab
      - datasource_desc
      - datasource

  MappedAttribute:
    slots:
      - attr_type
      - attr_mapping
    slot_usage:
      attr_type:
        range: MappedAttributeEnum
      attr_mapping:
        range: AttributeMapping

  Base:
    description: >-
      Base class for object to synthesize
    slots:
      - id
      - original_id
      - datasource
      - datasource_ids

  Coordinate:
    description: >-
      Spatial coordinates with absolute positioning information
    slots:
      - absolute
      - representative

  AbsoluteCoordinate:
    description: >-
      Absolute coordinate positioning with horizontal and vertical components
    slots:
      - horizontal_position
      - vertical_extent

  RepresentativeCoordinate:
    description: >-
      Representative coordinates describe the location of a feature by a representative shape / location.
    slots:
      - representative_point
      - representative_point_type
      - vertical_position

  HorizontalCoordinate:
    description: >-
      Horizontal positioning information with datum, type, and coordinates
    slots:
      - datum
      - coordinate_type
      - units
      - x_coordinate
      - y_coordinate

  VerticalCoordinate:
    description: >-
      Vertical positioning information with datum, type, and elevation
    slots:
      - datum
      - distance_units
      - encoding_method
      - resolution
      - vertical_extent_type
      - value

  DepthCoordinate:
    description: >-
      A depth vertical position (i.e., the height or depth from the specified reference position)
    slots:
      - datum
    slot_usage:
      datum:
        range: VerticalPositionDatumEnum

  RelatedSamplingFeatureComplex:
    is_a: Base
    description: >-
      Complex relationship between sampling features
    slots:
      - related_sampling_feature
      - related_sampling_feature_type
      - role

  TimeSeriesResult:
    description: >-
      Time series result data containing values and quality information
    slots:
      - result_quality
      - value

  Feature:
    is_a: Base
    description: >-
      A general feature upon which an observation can be made.
      Loosely after GF_Feature (ISO).
    slots:
      - name
      - description
      - feature_type
      - observed_properties

  SamplingFeature:
    is_a: Feature
    description: >-
      A feature where sampling is conducted.
      OGC Observation & Measurements SF_SamplingFeature.
    slots:
      - related_sampling_feature_complex

  SpatialSamplingFeature:
    is_a: SamplingFeature
    description: >-
      A spatially-defined feature where sampling is conducted.
      OGC Observation & Measurements SF_SpatialSamplingFeature.
    slots:
      - shape
      - coordinates

  MonitoringFeature:
    is_a: SpatialSamplingFeature
    description: >-
      A feature upon which monitoring is made.
      OGC Timeseries Profile OM_MonitoringFeature.
    slots:
      - description_reference
      - related_party
      - utc_offset
    slot_usage:
      id:
        description: Unique identifier for the monitoring feature
        required: true
      name:
        description: Human-readable name of the monitoring feature
      description:
        description: Detailed description of the monitoring feature

  RelatedSamplingFeature:
    is_a: Base
    description: >-
      Class that represents a related sampling feature and its role relative to
      the sampling feature to which it is related. Spatial hierarchies of features
      are built by specifying related sampling features.
      Data model from OGC Observations and Measurements.
    slots:
      - related_sampling_feature
      - related_sampling_feature_type
      - role
    slot_usage:
      role:
        description: relationship role
        range: RelationshipRoleEnum

  TimeValuePair:
    description: a time value pair
    slots:
      - timestamp
      - value

  Observation:
    is_a: Base
    description: >-
      OGC OM_Observation feature type. This is a parent class to which Mixins
      should be added to create observation types with metadata and result.
    slots:
      - type
      - utc_offset
      - phenomenon_time
      - observed_property
      - feature_of_interest
      - feature_of_interest_type
      - result_quality

  TimeMetadata:
    mixin: true
    slots:
      - aggregation_duration
      - time_reference_position

  MeasurementMetadata:
    mixin: true
    slots:
      - sampling_medium
      - statistic

  ResultPointFloat:
    slots:
      - value
      - result_quality

  MeasurementResult:
    mixin: true
    slots:
      - result
      - unit_of_measurement
    slot_usage:
      result:
        range: ResultPointFloat

  # Needs some work to understand arrays:
  #   The result is an array of TimeValuePairs
  ResultListTVP:
    slots:
      - value
      - result_quality

  MeasurementTimeseriesTVPResult:
    mixin: true
    slots:
      - result
      - unit_of_measurement
    slot_usage:
      result:
        range: ResultListTVP

  ObservationMeasurementTimeSeries:
    is_a: Observation
    mixins:
      - TimeMetadata
      - MeasurementMetadata
      - MeasurementTimeseriesTVPResult
    description: >-
      Represents a time-series of measurement observations collected at a monitoring feature.
      This is the main class for time-series observational data in BASIN-3D.


  Person:
    is_a: Base
    description: >-
      Represents a Person
    slots:
      - first_name
      - last_name
      - email
      - institution
      - role
    slot_usage:
      email:
        pattern: "^\\S+@[\\S+\\.]+\\S+"
      role:
        description: research role

slots:
  # Base slots
  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing
  datasource:
    description: Data source for this observation
    range: DataSource

  # Person slots
  first_name:
    description: First name for a person
  last_name:
    description: Last name for a person
  institution:
    description: more here
  email:
    slot_uri: schema:email
    description: The main email address of a person

  name:
    description: Human readable name
    range: string
  datasource_ids:
    description: Data source identifiers
    multivalued: true
  description:
    description: more detailed explanation of the feature
    range: string
  observed_properties:
    description: a list of observed properties on the feature
  related_party:
    description: >-
      list of Person, people or organizations responsible for Feature

  basin3d_vocab:
    description: common vocabulary for basin3d
  full_name:
    description: full name of the observed property
  categories:
    description: category of observed property

  attr_type:
    description: mapped attribute type
  basin3d_desc:
    description: The BASIN-3D vocabulary description
  datasource_vocab:
    description: The datasource vocabulary term
  datasource_desc:
    description: The datasource vocabulary description

  attr_mapping:
    description: vocabulary mapping between Basin3D and datasource

  # DataSource slots
  id_prefix:
    description: Prefix used for identifiers from this data source
  location:
    description: URL or location of the data source
    range: uri
  credentials:
    description: Authentication credentials for the data source
    range: string

  # Coordinate slots
  absolute:
    description: Absolute coordinate positioning
    range: AbsoluteCoordinate
  representative:
    description: Representative coordinate positioning
    range: RepresentativeCoordinate
  coordinates:
    description: Spatial coordinates of the feature
    range: Coordinate

  horizontal_position:
    description: Horizontal position information
    range: HorizontalCoordinate
    multivalued: true
    inlined_as_list: true
  vertical_extent:
    description: Vertical extent information
    range: VerticalCoordinate
    multivalued: true
    inlined_as_list: true

  # Position detail slots
  datum:
    description: Geodetic or vertical datum
  coordinate_type:
    description: Type of coordinate system
    range: CoordinateTypeEnum
  units:
    description: Units of measurement
  x_coordinate:
    description: X coordinate (longitude for geographic)
    range: float
  y_coordinate:
    description: Y coordinate (latitude for geographic)
    range: float
  distance_units:
    description: Units for distance measurements
  encoding_method:
    description: Method used for encoding the measurement
  resolution:
    description: Resolution of the measurement
    range: float
  vertical_extent_type:
    description: Type of vertical extent measurement
    range: VerticalExtentTypeEnum
  representative_point:
    description: A point representation of the feature.
    range: AbsoluteCoordinate
  representative_point_type:
    description: The type of representative point relative to the feature's geometry
    range: RepresentativePointTypeEnum
  vertical_position:
    description: The vertical position of the feature from a reference position (e.g., height or depth)
    range: DepthCoordinate

  value:
    description: Numeric value of the measurement
    range: float
  timestamp:
    description: timestamp of the observation in the result

  # Observation slots
  type:
    description: type of observation
    range: ObservationTypeEnum
  aggregation_duration:
    description: Duration over which data is aggregated
    range: AggregationDurationEnum
  feature_of_interest:
    description: The monitoring feature where the observation was made
    range: MonitoringFeature
    required: true
  feature_of_interest_type:
    description: Type of the feature of interest
    range: FeatureTypeEnum
  observed_property:
    description: The phenomenon that was observed
  phenomenon_time:
    description: Time when the phenomenon occurred
    range: datetime
  result:
    description: Result of the observation measurement
    range: TimeSeriesResult
  result_quality:
    description: Quality indicators for the result
    multivalued: true
  sampling_medium:
    description: Medium in which the sampling occurred
    range: SamplingMediumEnum
  statistic:
    description: Statistical measure applied to the data
    range: StatisticEnum
  time_reference_position:
    description: Position of time reference within aggregation period
    range: TimeReferencePositionEnum
  unit_of_measurement:
    description: Units of the measured values
  utc_offset:
    description: UTC offset for time values
    range: integer

  # MonitoringFeature specific slots
  description_reference:
    description: Reference to additional description information
  feature_type:
    description: Type of monitoring feature
    range: FeatureTypeEnum
  original_id:
    description: Original identifier from the data source
  related_sampling_feature_complex:
    description: Complex relationships to other sampling features
    range: RelatedSamplingFeatureComplex
    multivalued: true
    inlined_as_list: true
  shape:
    description: Geometric shape of the feature
    range: ShapeEnum

  # Related sampling feature slots
  related_sampling_feature:
    description: Identifier of related sampling feature
  related_sampling_feature_type:
    description: Type of related sampling feature
  role:
    description: Role

enums:
  # Enums for BASIN-3D classes
  MappedAttributeEnum:
    permissible_values:
      OBSERVED_PROPERTY:
        description: more here
      AGGREGATION_DURATION:
        description: more here
      RESULT_QUALITY:
        description: more here
      SAMPLING_MEDIUM:
        description: more here
      STATISTIC:
        description: more here

  AggregationDurationEnum:
    description: Duration over which observations are aggregated
    permissible_values:
      YEAR:
        description: Annual aggregation
      MONTH:
        description: Monthly aggregation
      DAY:
        description: Daily aggregation
      HOUR:
        description: Hourly aggregation
      MINUTE:
        description: Minute-level aggregation

  CoordinateTypeEnum:
    description: Type of coordinate system
    permissible_values:
      GEOGRAPHIC:
        description: Geographic coordinate system
      PROJECTED:
        description: Projected coordinate system
      LOCAL:
        description: Local coordinate system

  RepresentativePointTypeEnum:
    description: position of the representative point
    permissible_values:
      REPRESENTATIVE_POINT_TYPE_CENTER_LOCAL_SURFACE:
        description: Placement of the representative point is the center of a local surface
      REPRESENTATIVE_POINT_TYPE_UPPER_LEFT_CORNER:
        description: Placement of the representative point is the upper left corner (northwest)
      REPRESENTATIVE_POINT_TYPE_UPPER_RIGHT_CORNER:
        description: Placement of the representative point is the upper right corner (northeast)
      REPRESENTATIVE_POINT_TYPE_LOWER_LEFT_CORNER:
        description: Placement of the representative point is the lower left corner (southhwest)
      REPRESENTATIVE_POINT_TYPE_LOWER_RIGHT_CORNER:
        description: Placement of the representative point is the lower right corner (northeast)

  VerticalPositionDatumEnum:
    description: references for vertical position
    permissible_values:
      DATUM_LOCAL_SURFACE:
        description: local surface
      DATUM_MEAN_SEA_LEVEL:
        description: mean sea level

  FeatureTypeEnum:
    description: Type of monitoring or sampling feature
    permissible_values:
      POINT:
        description: Point feature
      VERTICAL_PATH:
        description: Vertical curve feature
      HORIZONTAL_PATH:
        description: Horizontal cure feature
      PLOT:
        description: sampling area defined by a polygon
      SITE:
        description: area of research project defined by a polygon
      REGION:
        description: Regional feature
      SUBBASIN:
        description: Sub-basin feature
      BASIN:
        description: Basin feature

  ObservationTypeEnum:
    description: Type of observation measurement
    permissible_values:
      MEASUREMENT_TVP_TIMESERIES:
        description: Time-value pair time series measurement
      MEASUREMENT_TIMESERIES:
        description: Time series measurement

  SamplingMediumEnum:
    description: Medium in which sampling occurred
    permissible_values:
      WATER:
        description: Water sampling medium
      GAS:
        description: Gas sampling medium
      SOLID_PHASE:
        description: Solid sampling medium
      OTHER:
        description: Other sampling medium
      NOT_APPLICABLE:
        description: not applicable

  ShapeEnum:
    description: Geometric shape of features
    permissible_values:
      POINT:
        description: Point geometry
      LINE:
        description: Line geometry
      SOLID:
        description: Volume geometry
      SURFACE:
        description: Surface geometry, described by polygon

  StatisticEnum:
    description: Statistical measures
    permissible_values:
      MEAN:
        description: Mean/average value
      MIN:
        description: Minimum value
      MAX:
        description: Maximum value
      TOTAL:
        description: Sum of values

  TimeReferencePositionEnum:
    description: Position of time reference within aggregation period
    permissible_values:
      START:
        description: Start of time period
      MIDDLE:
        description: Middle of time period
      END:
        description: End of time period

  VerticalExtentTypeEnum:
    description: Type of vertical extent measurement
    permissible_values:
      ALTITUDE:
        description: Altitude above sea level
      DEPTH:
        description: Depth below surface
      HEIGHT:
        description: Height above ground

  RelationshipRoleEnum:
    description: Role in sampling feature relationships
    permissible_values:
      PARENT:
        description: Parent relationship

  ResultQualityEnum:
    description: Quality code for the result
    permissible_values:
      UNVALIDATED:
        description: The result is raw or unchecked for quality. Synonyms Unchecked, Preliminary, No QC
      VALIDATED:
        description: The result has been checked for quality and no issues identified. Synonyms Checked, Accepted, Pass, OK, Good
      REJECTED:
        description: The result is identified as poor quality. Synonyms Poor, Bad, Unaccepted
      SUSPECTED:
        description: The result's quality is suspect. Synonyms Questionable, Doubtful, Spike/Noise, Flagged
      ESTIMATED:
        description: The result is estimated. Synonyms Interpolated, Modeled.
      NOT_SUPPORTED:
        description: not supported
